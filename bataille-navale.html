  const addCls = (i, c) => { tCells[i] = tCells[i] || {}; tCells[i].cls = ((tCells[i].cls || "") + " " + c).trim(); };
  evMine.filter(e => e.info).forEach(e => {
    if(e.info === "C"){ neigh8(e.cell).forEach((n, b) => { if(n >= 0 && (e.val & (1 << b)) && !myShotSet.has(n)) tMarks.push({i:n, cls:"dry"}); }); return; }
    zoneOf({t:e.info, cells:[e.cell]}).forEach(c => addCls(c, "scan"));
    tMarks.push({i:e.info === "R" ? Math.floor(e.cell / 10) * 10 : e.cell, cls:"badge", txt:String(e.val)});
  });
  evMine.filter(e => e.res).forEach(e => {
    tCells[e.cell] = Object.assign(tCells[e.cell] || {}, {label:e.res === "0" ? "à l'eau" : "touché", off:true});
    tMarks.push({i:e.cell, cls:(e.res === "0" ? "miss" : "hit") + (fresh && fresh.mine && fresh.cells.includes(e.cell) ? " fresh" : "")});
  });
  if(pendTok && tl.pending.by === mine){
    shotCellsOf(pendTok).forEach(c => tMarks.push({i:c, cls:"pend"}));
    zoneOf(pendTok).forEach(c => addCls(c, "scan"));
  }
  const lastMine = [...evMine].reverse().find(e => e.res);
  if(lastMine) tMarks.push({i:lastMine.cell, cls:"last"});
  const pz = ui.pw ? pwZone(ui.pw) : null;
  for(let i = 0; i < 100; i++){
    if(!tCells[i]) tCells[i] = {};
    if(!myTurn || tl.pending) tCells[i].off = true;
    else if(ui.pw) tCells[i].off = (ui.pw.t === "C" || ui.pw.t === "D") && myShotSet.has(i);
  }
  if(pz){ pz.ring.forEach(c => addCls(c, "pv2")); pz.zone.forEach(c => addCls(c, pz.ok ? "pv" : "pvbad")); }
  else if(G.aim !== null && myTurn) addCls(G.aim, "aim");
  // ma flotte
  const mySunk = new Set(); G.sk.forEach((s, k) => { if(s) mySunk.add(k); });
  const mShips = G.fleet.map((cells, k) => ({k, cells, cls:(mySunk.has(k) ? "sunk" : "") + (mTeam === "b" ? " tb" : "")}));
  const mMarks = [], mCells = {};
  const lastOppInfo = [...evOpp].reverse().find(e => e.info && e.info !== "C");
  if(lastOppInfo) zoneOf({t:lastOppInfo.info, cells:[lastOppInfo.cell]}).forEach(c => mCells[c] = {cls:"scanopp"});
  evOpp.filter(e => e.res).forEach(e => mMarks.push({i:e.cell, cls:(e.res === "0" ? "miss" : "hit") + (fresh && !fresh.mine && fresh.cells.includes(e.cell) ? " fresh" : "")}));
  const lastOpp = [...evOpp].reverse().find(e => e.res);
  if(lastOpp) mMarks.push({i:lastOpp.cell, cls:"last"});
  // statut et humeurs
  const ready = powerReady(tl, mine), pw = powerOf(G.av);
  let big = "", cls = "", line = ui.flash || "";
  if(tl.winner){ const win = tl.winner === mine; big = win ? "Victoire !" : "Défaite"; cls = win ? "win" : "lose"; line = win ? `Tu as coulé toute la flotte de ${esc(oppName())}.` : `${esc(oppName())} a coulé toute ta flotte.`; }
  else if(tl.pending){
    const isInfo = pendTok.t === "R" || pendTok.t === "M";
    big = tl.pending.by === mine ? (isInfo ? "Analyse en cours…" : pendTok.t !== "S" ? "Pouvoir lancé…" : "Tir en route…") : `${esc(oppName())} ${pendTok.t !== "S" ? "déclenche son pouvoir…" : "a tiré…"}`;
  }
  else if(myTurn && ui.pw){ big = POWER_NAME[ui.pw.t]; cls = "mine"; line = pz && pz.zone.length && !pz.ok ? pz.why : POWER_HINT[ui.pw.t]; }
  else if(myTurn){ big = "À toi de tirer"; cls = "mine"; if(!line) line = ready ? "Ta jauge est pleine : tu peux déclencher ton pouvoir." : "Touche une case des eaux adverses pour viser."; }
  else { big = `${esc(oppName())} vise…`; if(!line) line = "Attends son tir."; }
  let moods = {me: myTurn ? "aim" : "idle", opp: !myTurn && !tl.winner ? "aim" : "idle"};
  const lastEv = [...tl.events].reverse().find(e => e.res);
  if(tl.winner) moods = tl.winner === mine ? {me:"cool", opp:"lose"} : {me:"lose", opp:"cool"};
  else if(lastEv && isHit(lastEv)){
    const sk = lastEv.res >= "a";
    if(lastEv.by === mine) moods = {me: sk ? "cool" : "win", opp: sk ? "lose" : moods.opp};
    else moods = {me: sk ? "lose" : moods.me, opp: sk ? "cool" : "win"};
  }
  const shotsN = evMine.filter(e => e.res).length, hits = evMine.filter(isHit).length;
  const hitsOn = k => G.fleet[k] ? evOpp.filter(e => isHit(e) && G.fleet[k].includes(e.cell)).length : 0;
  const rematchAsk = tl.winner && G.opp && G.opp.g > G.g;
  const end = tl.winner ? `<section class="endcard">
      ${endScene(tl)}
      <div class="stats"><div><b>${shotsN}</b><span>tirs</span></div><div><b>${hits}</b><span>touchés</span></div><div><b>${shotsN ? Math.round(100 * hits / shotsN) : 0} %</b><span>précision</span></div></div>
      <p class="score">Score : ${esc(G.name)} ${G.score.me} – ${G.score.opp} ${esc(oppName())}</p>
      ${rematchAsk ? `<div class="banner"><p><b>${esc(oppName())}</b> propose une revanche.</p><button class="btn brass" type="button" data-act="rematch">Accepter la revanche</button></div>` : `<button class="btn big primary" type="button" data-act="rematch">Revanche</button>`}
      <button class="btn big" type="button" data-act="quit">Quitter</button>
    </section>` : "";
  const hud = `--hudc:var(--team-${mTeam})`;
  let actions = "";
  if(myTurn && !tl.pending && ui.pw){
    actions = `<div class="pwbar" style="${hud}"><p><b>${esc(POWER_NAME[ui.pw.t])}</b> · ${esc(nbsp(pw.desc))}</p>
      <div class="row">${ui.pw.t === "L" ? `<button class="btn" type="button" data-act="pwrot">${ui.pw.dir === "h" ? "Passer à la verticale" : "Passer à l'horizontale"}</button>` : ""}
        <button class="btn" type="button" data-act="pwcancel">Annuler</button>
        <button class="btn power" type="button" data-act="pwgo"${pz && pz.ok ? "" : " disabled"}>Lancer</button></div></div>`;
  } else if(myTurn && !tl.pending){
    actions = `<div class="firebar"><button class="btn big brass" type="button" data-act="fire"${G.aim === null ? " disabled" : ""}>${G.aim === null ? "Choisis une case" : "Tirer en " + cellName(G.aim)}</button></div>`
      + (ready ? `<button class="btn big power" type="button" data-act="power" style="${hud}">★ Pouvoir : ${esc(pw.name)}</button>` : "");
  }
  return `${topBar()}
  ${oppLine()}
  ${duel(moods, myTurn, !tl.winner && tl.turn && tl.turn !== mine, tl)}
  <section class="status" aria-live="polite"><p class="big ${cls}">${big}</p>${line ? `<p class="line">${line}</p>` : ""}</section>
  ${end}
  <p class="label">Eaux de ${esc(oppName())} · ${esc(decor[1])}</p>
  ${boardHTML({cls:myTurn && !tl.pending ? "live" : "", act:"shoot", cells:tCells, ships:tShips, marks:tMarks, style:hud})}
  ${actions}
  <div class="under">
    <section><h2>Ta flotte</h2>${boardHTML({cls:"small", ships:mShips, marks:mMarks, cells:mCells})}</section>
    <section><h2>Sa flotte</h2><ul class="fleetlist">${SHIPS.map((s, k) => `<li class="${oppSunk.has(k) ? "down" : ""}">${esc(s.name)}${pips(s.len, oppSunk.has(k) ? s.len : 0)}</li>`).join("")}</ul>
      <h2 style="margin-top:14px">Tes bateaux</h2><ul class="fleetlist">${SHIPS.map((s, k) => `<li class="${mySunk.has(k) ? "down" : ""}">${esc(s.name)}${pips(s.len, hitsOn(k))}</li>`).join("")}</ul></section>
  </div>
  <p class="note">Ton pouvoir, <b>${esc(pw.name)}</b> : ${esc(nbsp(pw.desc))} La jauge se remplit quand tu touches (+1) et quand tu es touché (+2).</p>
  ${replayRule() ? `<p class="note">Règle de la partie : on rejoue après un tir touché.</p>` : ""}`;
}

function viewSheet(){
  return `<div class="backdrop" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h2 class="h1" id="sh-t" style="font-size:1.6rem">Quitter la partie ?</h2>
    <p class="note">${esc(oppName())} sera prévenu. Vous pourrez en recommencer une autre.</p>
    <div class="row"><button class="btn primary" type="button" data-act="leave">Quitter</button><button class="btn" type="button" data-act="closesheet">Continuer</button></div>
  </div></div>`;
}

const app = document.getElementById("app");
function render(){
  if(drag && drag.moved) return;
  let h;
  if(!G) h = viewHome();
  else if(started() || (G.over && G.opp && G.opp.g >= G.g && G.counted === G.g)) h = viewBattle();
  else h = viewPlace();
  if(ui.sheet && G) h += viewSheet();
  Sound.music(!G ? "port" : started() && !battle().winner ? "combat" : "port");
  const y = window.scrollY;
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = h;
  if(focusId){ const el = document.getElementById(focusId); if(el && el.tagName === "INPUT"){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
  window.scrollTo(0, y);
}

/* ================= Glisser pour placer ================= */
let drag = null, suppressClick = 0;
function clearPreview(){
  document.querySelectorAll("#placeboard .gok, #placeboard .gbad").forEach(c => c.classList.remove("gok", "gbad"));
}
function cellAt(x, y){
  const el = document.elementFromPoint(x, y);
  const c = el && el.closest && el.closest("#placeboard .cell");
  return c ? +c.dataset.i : null;
}
app.addEventListener("pointerdown", e => {
  if(!G || G.ready || started() || e.button > 0) return;
  const tray = e.target.closest(".shipbtn");
  const cellEl = e.target.closest("#placeboard .cell");
  let k = null, off = 0;
  if(tray) k = +tray.dataset.k;
  else if(cellEl){
    const i = +cellEl.dataset.i;
    k = G.fleet.findIndex(s => s && s.includes(i));
    if(k < 0) return;
  } else return;
  off = Math.floor(SHIPS[k].len / 2);
  drag = {k, off, dir:dirOf(G.fleet[k]) || G.pref, x:e.clientX, y:e.clientY, moved:false, fromTray:!!tray, cells:null, ghost:null};
});
app.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    const sh = document.querySelector(`#placeboard .ship[data-ship="${drag.k}"]`);
    if(sh) sh.classList.add("lift");
    const g = document.createElement("img");
    g.className = "dragghost"; g.src = ART.top[drag.k][drag.dir]; g.alt = "";
    const cellW = (document.querySelector("#placeboard .cell") || {}).offsetWidth || 30;
    g.style.width = (drag.dir === "h" ? SHIPS[drag.k].len : 1) * cellW + "px";
    if(team(G.role) === "b") g.style.setProperty("--tf", "hue-rotate(208deg) saturate(1.1)");
    document.body.appendChild(g); drag.ghost = g;
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  clearPreview();
  const gy = e.clientY - (drag.ghost.offsetHeight * 0.7);
  const i = cellAt(e.clientX, Math.max(0, gy));
  drag.cells = null;
  if(i === null) return;
  const cells = bestCells(drag.k, i, drag.off, drag.dir, false);
  const shown = cells || (() => {
    const len = SHIPS[drag.k].len, r = Math.floor(i / 10), c = i % 10;
    return drag.dir === "h" ? shipCells(len, r * 10 + Math.min(Math.max(c - drag.off, 0), 10 - len), "h") : shipCells(len, Math.min(Math.max(r - drag.off, 0), 10 - len) * 10 + c, "v");
  })();
  drag.cells = cells;
  (shown || []).forEach(x => { const el = document.querySelector(`#placeboard .cell[data-i="${x}"]`); if(el) el.classList.add(cells ? "gok" : "gbad"); });
}, {passive:false});
function endDrag(e, cancel){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.ghost) d.ghost.remove();
  if(!d.moved) return;
  suppressClick = Date.now();
  clearPreview();
  if(!cancel && d.cells){ commitPlace(d.k, d.cells); }
  else if(!cancel) ui.flash = "Pas la place ici : essaie une autre case, ou tourne le bateau.";
  save(); render();
}
app.addEventListener("pointerup", e => endDrag(e, false));
app.addEventListener("pointercancel", e => endDrag(e, true));

/* ================= Événements ================= */
app.addEventListener("click", e => {
  if(Date.now() - suppressClick < 400) return;
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  if(b.classList.contains("backdrop") && e.target !== b) return;
  const a = b.dataset.act;
  switch(a){
    case "av": ui.av = normAv(b.dataset.v); store.set("tc.av", ui.av); render(); break;
    case "create": createGame(); break;
    case "tojoin": ui.screen = "join"; ui.err = ""; render(); break;
    case "tohome": ui.screen = "home"; ui.err = ""; render(); break;
    case "join": joinGame(ui.joinCode); break;
    case "joinlist": ui.joinCode = b.dataset.code; joinGame(b.dataset.code); break;
    case "resume": resumeGame(); break;
    case "dropresume": ui.resume = null; store.del("tc.session"); render(); break;
    case "copy": copyText(b.dataset.text); break;
    case "share": navigator.share({title:"Touché-coulé", text:`Rejoins ma bataille navale : code ${G.code}`, url:location.href.split("#")[0] + "#" + G.code}).catch(() => {}); break;
    case "place": placeAt(+b.dataset.i); save(); render(); break;
    case "sel": G.sel = +b.dataset.k; ui.flash = G.fleet[G.sel] ? "" : "Glisse-le sur la grille, ou touche une case pour le poser."; render(); break;
    case "rotate": if(G.sel !== null && G.sel !== undefined) rotate(G.sel); else ui.flash = "Choisis d'abord un bateau."; save(); render(); break;
    case "random": { const f = randomFleet(); if(f){ G.fleet = f; G.sel = null; ui.flash = ""; } save(); render(); break; }
    case "clear": G.fleet = SHIPS.map(() => null); G.sel = 0; ui.flash = ""; save(); render(); break;
    case "ready": if(G.fleet.every(Boolean)){ G.ready = true; G.sel = null; ui.flash = ""; react(); save(); publish(); render(); window.scrollTo(0, 0); } break;
    case "unready": if(!started()){ G.ready = false; G.sel = 0; save(); publish(); render(); } break;
    case "shoot": { const i = +b.dataset.i; if(ui.pw){ pwPick(i); break; } if(G.aim === i) fire(i); else { G.aim = i; Sound.sfx("click"); render(); } break; }
    case "power": { const pw = powerOf(G.av); ui.pw = {t:pw.t, cells:[], dir:"h"}; G.aim = null; ui.flash = ""; Sound.sfx("open"); render(); break; }
    case "pwcancel": ui.pw = null; render(); break;
    case "pwrot": if(ui.pw){ ui.pw.dir = ui.pw.dir === "h" ? "v" : "h"; render(); } break;
    case "pwgo": launchPower(); break;
    case "sound": Sound.toggle(); render(); break;
    case "fire": if(G.aim !== null) fire(G.aim); break;
    case "rematch": rematch(); break;
    case "quit": ui.sheet = "quit"; render(); break;
    case "closesheet": ui.sheet = null; render(); break;
    case "leave": leaveGame(G && G.opp && G.opp.bye); break;
    case "allgames": if(document.referrer && new URL(document.referrer, location.href).origin === location.origin && history.length > 1) history.back(); else location.href = "./"; break;
  }
});
app.addEventListener("input", e => {
  const el = e.target;
  if(el.id === "name"){
    ui.name = el.value; store.set("tc.name", cleanName(el.value));
    document.querySelectorAll(".avopt .avinit").forEach(x => { x.textContent = (el.value.trim()[0] || "?").toUpperCase(); });
  }
  if(el.id === "code"){ const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4); if(v !== el.value) el.value = v; ui.joinCode = v; }
});
app.addEventListener("change", e => {
  if(e.target.id === "replay"){ ui.replay = e.target.checked; store.set("tc.replay", ui.replay); }
});
app.addEventListener("keydown", e => {
  if(e.key === "Escape" && ui.sheet){ ui.sheet = null; render(); return; }
  if(e.key === "Enter" && e.target.id === "code"){ e.preventDefault(); joinGame(ui.joinCode); }
});
function copyText(t){
  const done = () => { ui.copied = true; render(); setTimeout(() => { ui.copied = false; render(); }, 1800); };
  try{ navigator.clipboard.writeText(t).then(done, () => selectFallback()); }catch(e){ selectFallback(); }
}
function selectFallback(){
  const el = document.querySelector(".linktext, .codecard .code");
  if(!el) return;
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* ================= Démarrage ================= */
function boot(data){
  const saved = (data && data.G) || store.get("tc.session");
  if(saved && saved.code && saved.pid && Array.isArray(saved.fleet) && Date.now() - (saved.t || 0) < 3 * 86400000 && !saved.bye){
    ui.resume = saved;
    if(data && data.G){ resumeGame(); return; }
  }
  const h = (location.hash || "").replace("#", "").toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(h) && !(ui.resume && ui.resume.code === h)){ ui.joinCode = h; ui.screen = "join"; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({G}));
const hot = window.claude?.hot;
hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
</script>
</body></html>
